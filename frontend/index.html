        body {

            width: 100%;

            overflow: hidden;

            background:
                var(--bg);

        }

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            color:
                var(--white);

        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:

                radial-gradient(
                    circle at 50% 40%,
                    rgba(30, 205, 255, 0.13),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 50% 42%,
                    rgba(30, 140, 220, 0.08),
                    transparent 48%
                ),

                linear-gradient(
                    180deg,
                    #02060b,
                    #010309
                );

        }


        body::after {

            content: "";

            position: fixed;

            inset: 0;

            background:
                linear-gradient(
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px

        .logo-title {

        }


        .logo-subtitle {

            margin-top: 2px;

        .status {

        .status-dot {

           CORE
        ===================================================== */

        .core-wrapper {

            position: absolute;

            left: 50%;

            top: 37%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            width:
                min(500px, 80vw);

            aspect-ratio:
                1;

            display: flex;

            align-items: center;

        }


        .core-glow {

            position: absolute;

            width: 300px;

            height: 300px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(59,220,255,0.26),

            filter:

        }


        @keyframes glowPulse {

            0%,
            100% {

                transform:
                    scale(1);

                opacity:

            }

            50% {

                transform:
                    scale(1.1);

                opacity:

            }

        }


        .ring {

            position: absolute;

            border-radius: 50%;

            border:
                1px solid

        .ring-1 {

            width: 170px;

            height: 170px;

                rgba(59,220,255,0.75);

            border-left-color:
                transparent;

            animation:
                spinA 9s linear infinite;

        }


        .ring-2 {

            width: 220px;

            height: 220px;

            border-bottom-color:
                rgba(59,220,255,0.65);

            border-top-color:
                transparent;

            animation:
                spinB 13s linear infinite;

        }


        .ring-3 {

            width: 280px;

            border-left-color:

            border-right-color:

            animation:
                spinA 18s linear infinite;

        }


        .ring-4 {

            width: 345px;

            height: 345px;

            border-top-color:

            border-bottom-color:

            animation:
                spinB 25s linear infinite;

        }


        @keyframes spinA {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }

        }


        @keyframes spinB {

            from {
                transform:
                    rotate(360deg);
            }

            to {
                transform:
                    rotate(0deg);
            }

        }


        .core {

            width: 118px;

            height: 118px;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:

        .core::before {

            content: "";

            inset: 17px;

            border-radius: 50%;

            border:
                1px solid

            box-shadow:

        }


        .core::after {

            content: "";

            width: 30px;

            height: 30px;

            border-radius: 50%;

            background:
                #c9fbff;

            box-shadow:

                0 0 15px #8ef3ff,

            animation:
                nucleus 2s ease-in-out infinite;

        }


        @keyframes nucleus {

            0%,

                transform:

            50% {

                transform:
                    scale(1.08);

            }

        /* =====================================================
           WAVE
        ===================================================== */

        .wave {

            position: absolute;

            left: 50%;

            top: 60%;

            transform:
                translateX(-50%);

            width: 220px;

            height: 34px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 3px;

            opacity: .45;

        }


        .wave span {

            width: 3px;

            border-radius: 6px;

            background:

            box-shadow:
                0 0 7px
                rgba(59,220,255,0.45);

            animation:
                waveMove
                1.1s
                ease-in-out infinite;

        }


        .wave span:nth-child(1) {
            height: 7px;
        }

        .wave span:nth-child(2) {
            height: 12px;
            animation-delay: .08s;
        }

        .wave span:nth-child(3) {
            height: 18px;
            animation-delay: .16s;
        }

        .wave span:nth-child(4) {
            height: 27px;
            animation-delay: .24s;
        }

        .wave span:nth-child(5) {
            height: 16px;
            animation-delay: .32s;
        }

        .wave span:nth-child(6) {
            height: 29px;
            animation-delay: .40s;
        }

        .wave span:nth-child(7) {
            height: 18px;
            animation-delay: .48s;
        }

        .wave span:nth-child(8) {
            height: 24px;
            animation-delay: .56s;
        }

        .wave span:nth-child(9) {
            height: 11px;
            animation-delay: .64s;
        }

        .wave span:nth-child(10) {
            height: 7px;
            animation-delay: .72s;
        }


        @keyframes waveMove {

            0%,
            100% {

                transform:
                    scaleY(.45);

                opacity:
                    .3;

            }

            50% {

                transform:
                    scaleY(1);

                opacity:
                    1;

            }

        }


        /* =====================================================
           CHAT
        ===================================================== */

        .chat-area {

        /* =====================================================

        .command-area {

                var(--cyan);

            <div class="core-bottom-label">
                JARVIS CORE
            </div>

        </div>

        <div class="wave">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

                </span>

            <div class="system-item">

                <span class="label">

                <span

<!-- =========================================================

<div
    id="visionLayer"

>

    <div class="vision-card">

        <div
            id="visionTitle"
            class="vision-title"
        >

        </div>

            alt="Vision"

</div>


<script>

    /* =========================================================
       BACKEND
    ========================================================= */

    const BACKEND_URL =
        "http://127.0.0.1:8000";


    const CHAT_ENDPOINT =
        `${BACKEND_URL}/chat`;


    const STATUS_ENDPOINT =
        `${BACKEND_URL}/status`;


    const SYSTEM_ENDPOINT =
        `${BACKEND_URL}/system`;


    const WAKE_ENDPOINT =
        `${BACKEND_URL}/wake`;


    const SLEEP_ENDPOINT =
        `${BACKEND_URL}/sleep`;


    const MEMORY_ENDPOINT =
        `${BACKEND_URL}/memory/clear`;


    const VISION_ENDPOINT =
        `${BACKEND_URL}/vision`;


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const commandInput =
        document.getElementById(
            "commandInput"
        );


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    const micButton =
        document.getElementById(
            "micButton"
        );


    const visionButton =
        document.getElementById(
            "visionButton"
        );


    const visionInput =
        document.getElementById(
            "visionInput"
        );


    const visionLayer =
        document.getElementById(
            "visionLayer"
        );


    const visionPreview =
        document.getElementById(
            "visionPreview"
        );


    const visionTitle =
        document.getElementById(
            "visionTitle"
        );


    const chatMessages =
        document.getElementById(
            "chatMessages"
        );


    const statusDot =
        document.getElementById(
            "statusDot"
        );


    const statusText =
        document.getElementById(
            "statusText"
        );


    const coreState =
        document.getElementById(
            "coreState"
        );


    const groqStatus =
        document.getElementById(
            "groqStatus"
        );


    const coreStatus =
        document.getElementById(
            "coreStatus"
        );


    const webStatus =
        document.getElementById(
            "webStatus"
        );


    const visionStatus =
        document.getElementById(
            "visionStatus"
        );


    const clock =
        document.getElementById(
            "clock"
        );


    const systemCpu =
        document.getElementById(
            "systemCpu"
        );


    const systemRam =
        document.getElementById(
            "systemRam"
        );


    const systemDisk =
        document.getElementById(
            "systemDisk"
        );


    const systemBattery =
        document.getElementById(
            "systemBattery"
        );


    const systemNetwork =
        document.getElementById(
            "systemNetwork"
        );


    const systemUptime =
        document.getElementById(
            "systemUptime"
        );


    /* =========================================================
       STATE
    ========================================================= */

    let isSending = false;

    let recognition = null;

    let isListening = false;


    /* =========================================================
       CLOCK
    ========================================================= */

    function updateClock() {

        const now =
            new Date();


        clock.textContent =
            now.toLocaleTimeString(
                "en-IN",
                {
                    hour12: false
                }
            );

    }


    updateClock();


    setInterval(
        updateClock,
        1000
    );


    /* =========================================================
       STATE
    ========================================================= */

    function setState(
        text
    ) {

        coreState.textContent =
            String(
                text || ""
            ).toUpperCase();

    }


    /* =========================================================
       CHAT MESSAGE
    ========================================================= */

    function addMessage(
        text,
        role = "assistant"
    ) {

        const value =
            String(
                text || ""
            ).trim();


        if (!value) {
            return;
        }


        const div =
            document.createElement(
                "div"
            );


        div.className =
            role === "user"
            ? "msg msg-user"
            : "msg msg-ai";


        const label =
            document.createElement(
                "span"
            );


        label.className =
            "msg-label";


        label.textContent =
            role === "user"
            ? "YOU"
            : "JARVIS";


        div.appendChild(
            label
        );


        div.appendChild(
            document.createTextNode(
                value
            )
        );


        chatMessages.appendChild(
            div
        );


        chatMessages.scrollTop =
            chatMessages.scrollHeight;

    }


    /* =========================================================
       STATUS
    ========================================================= */

    async function checkStatus() {

        try {

            const response =
                await fetch(
                    STATUS_ENDPOINT,
                    {
                        method:
                            "GET",

                        cache:
                            "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            statusDot.className =
                data.status === "online"
                ? "status-dot online"
                : "status-dot";


            statusText.textContent =
                data.status === "online"
                ? "SYSTEM ONLINE"
                : "BACKEND OFFLINE";


            groqStatus.textContent =
                data.groq
                ? "READY"
                : "OFFLINE";


            groqStatus.className =
                data.groq
                ? "ready"
                : "offline";


            coreStatus.textContent =
                data.core
                ? "READY"
                : "OFFLINE";


            coreStatus.className =
                data.core
                ? "ready"
                : "offline";


            webStatus.textContent =
                data.web
                ? "READY"
                : "OFFLINE";


            webStatus.className =
                data.web
                ? "ready"
                : "offline";


            visionStatus.textContent =
                data.vision
                ? "READY"
                : "STANDBY";


            visionStatus.className =
                data.vision
                ? "ready"
                : "";


            if (
                data.sleeping
            ) {

                setState(
                    "SLEEP MODE"
                );

            }
            else if (
                data.core
            ) {

                setState(
                    "SYSTEM READY"
                );

            }

        }
        catch (error) {

            console.error(
                "[STATUS]",
                error
            );


            statusDot.className =
                "status-dot";


            statusText.textContent =
                "BACKEND OFFLINE";


            groqStatus.textContent =
                "OFFLINE";

            groqStatus.className =
                "offline";


            coreStatus.textContent =
                "OFFLINE";

            coreStatus.className =
                "offline";


            webStatus.textContent =
                "OFFLINE";

            webStatus.className =
                "offline";


            visionStatus.textContent =
                "OFFLINE";

            visionStatus.className =
                "offline";


            setState(
                "CONNECTION LOST"
            );

        }

    }


    /* =========================================================
       REAL SYSTEM MONITOR
    ========================================================= */

    async function updateSystemMetrics() {

        try {

            const response =
                await fetch(
                    SYSTEM_ENDPOINT,
                    {
                        method:
                            "GET",

                        cache:
                            "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            if (
                !data.success
            ) {

                return;

            }


            /* -------------------------------------------------
               CPU
            ------------------------------------------------- */

            const cpu =
                Number(
                    data.cpu || 0
                );


            systemCpu.textContent =
                `${cpu.toFixed(1)}%`;


            /* -------------------------------------------------
               RAM
            ------------------------------------------------- */

            const ram =
                Number(
                    data.ram || 0
                );


            systemRam.textContent =
                `${ram.toFixed(1)}%`;


            /* -------------------------------------------------
               DISK
            ------------------------------------------------- */

            const disk =
                Number(
                    data.disk || 0
                );


            systemDisk.textContent =
                `${disk.toFixed(1)}%`;


            /* -------------------------------------------------
               BATTERY
            ------------------------------------------------- */

            if (
                data.battery !== null
                &&
                data.battery !== undefined
            ) {

                const battery =
                    Number(
                        data.battery || 0
                    );


                systemBattery.textContent =
                    data.battery_charging
                    ? `${battery.toFixed(0)}% ⚡`
                    : `${battery.toFixed(0)}%`;

            }
            else {

                systemBattery.textContent =
                    "N/A";

            }


            /* -------------------------------------------------
               NETWORK
            ------------------------------------------------- */

            const sent =
                data.network_sent_text
                ||
                "0 B";


            const received =
                data.network_received_text
                ||
                "0 B";


            systemNetwork.textContent =
                `${sent} ↑ / ${received} ↓`;


            /* -------------------------------------------------
               UPTIME
            ------------------------------------------------- */

            systemUptime.textContent =
                data.uptime_text
                ||
                "--";


            /* -------------------------------------------------
               Warning levels
            ------------------------------------------------- */

            if (
                cpu >= 85
            ) {

                systemCpu.style.color =
                    "var(--yellow)";

            }
            else {

                systemCpu.style.color =
                    "";

            }


            if (
                ram >= 85
            ) {

                systemRam.style.color =
                    "var(--yellow)";

            }
            else {

                systemRam.style.color =
                    "";

            }


            if (
                disk >= 90
            ) {

                systemDisk.style.color =
                    "var(--yellow)";

            }
            else {

                systemDisk.style.color =
                    "";

            }

        }
        catch (error) {

            console.error(
                "[SYSTEM MONITOR]",
                error
            );


            systemCpu.textContent =
                "--.-%";

            systemRam.textContent =
                "--.-%";

            systemDisk.textContent =
                "--.-%";

            systemBattery.textContent =
                "--";

            systemNetwork.textContent =
                "--";

            systemUptime.textContent =
                "--";

        }

    }


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    async function sendMessage() {

        if (
            isSending
        ) {

            return;

        }


        const text =
            commandInput.value.trim();


        if (!text) {

            return;

        }


        isSending =
            true;


        sendButton.disabled =
            true;


        addMessage(
            text,
            "user"
        );


        commandInput.value =
            "";


        setState(
            "PROCESSING"
        );


        try {

            const response =
                await fetch(
                    CHAT_ENDPOINT,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({
                                message:
                                    text
                            })

                    }
                );


            const data =
                await response.json();


            console.log(
                "[JARVIS]",
                data
            );


            const reply =
                String(
                    data.reply ||
                    data.message ||
                    ""
                ).trim();


            if (
                reply
            ) {

                addMessage(
                    reply,
                    "assistant"
                );


                speak(
                    reply
                );

            }
            else if (
                data.sleeping
            ) {

                addMessage(
                    "JARVIS is sleeping.",
                    "assistant"
                );

            }
            else {

                addMessage(
                    "Sir, मला response मिळाला नाही.",
                    "assistant"
                );

            }


            if (
                data.web
            ) {

                setState(
                    "WEB SEARCH"
                );

            }
            else if (
                data.local
            ) {

                setState(
                    data.sleeping
                    ? "SLEEP MODE"
                    : "COMMAND EXECUTED"
                );

            }
            else {

                setState(
                    "SYSTEM READY"
                );

            }


            await checkStatus();

            await updateSystemMetrics();

        }
        catch (error) {

            console.error(
                "[CHAT]",
                error
            );


            addMessage(
                "Sir, backend connection problem आली.",
                "assistant"
            );


            setState(
                "CONNECTION ERROR"
            );

        }
        finally {

            isSending =
                false;


            sendButton.disabled =
                false;


            commandInput.focus();

        }

    }


    /* =========================================================
       ENTER
    ========================================================= */

    commandInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =========================================================
       SEND
    ========================================================= */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /* =========================================================
       WAKE
    ========================================================= */

    document
        .getElementById(
            "wakeButton"
        )
        .addEventListener(
            "click",
            async () => {

                try {

                    const response =
                        await fetch(
                            WAKE_ENDPOINT,
                            {
                                method:
                                    "POST"
                            }
                        );


                    const data =
                        await response.json();


                    const reply =
                        data.reply ||
                        "Ready Sir.";


                    addMessage(
                        reply,
                        "assistant"
                    );


                    speak(
                        reply
                    );


                    setState(
                        "SYSTEM READY"
                    );


                    await checkStatus();

                }
                catch (error) {

                    console.error(
                        "[WAKE]",
                        error
                    );

                }

            }
        );


    /* =========================================================
       SLEEP
    ========================================================= */

    document
        .getElementById(
            "sleepButton"
        )
        .addEventListener(
            "click",
            async () => {

                try {

                    const response =
                        await fetch(
                            SLEEP_ENDPOINT,
                            {
                                method:
                                    "POST"
                            }
                        );


                    const data =
                        await response.json();


                    const reply =
                        data.reply ||
                        "Okay Sir, sleeping now.";


                    addMessage(
                        reply,
                        "assistant"
                    );


                    speak(
                        reply
                    );


                    setState(
                        "SLEEP MODE"
                    );


                    await checkStatus();

                }
                catch (error) {

                    console.error(
                        "[SLEEP]",
                        error
                    );

                }

            }
        );


    /* =========================================================
       MEMORY
    ========================================================= */

    document
        .getElementById(
            "memoryButton"
        )
        .addEventListener(
            "click",
            async () => {

                const confirmed =
                    window.confirm(
                        "Clear JARVIS memory?"
                    );


                if (!confirmed) {

                    return;

                }


                try {

                    const response =
                        await fetch(
                            MEMORY_ENDPOINT,
                            {
                                method:
                                    "POST"
                            }
                        );


                    const data =
                        await response.json();


                    const message =
                        data.message ||
                        "Memory cleared.";


                    addMessage(
                        message,
                        "assistant"
                    );


                    speak(
                        message
                    );

                }
                catch (error) {

                    console.error(
                        "[MEMORY]",
                        error
                    );


                    addMessage(
                        "Memory clear failed.",
                        "assistant"
                    );

                }

            }
        );


    /* =========================================================
       VOICE RECOGNITION
    ========================================================= */

    function setupVoice() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (
            !SpeechRecognition
        ) {

            console.warn(
                "[VOICE] Not supported."
            );

            return;

        }


        recognition =
            new SpeechRecognition();


        recognition.continuous =
            false;


        recognition.interimResults =
            false;


        recognition.lang =
            "en-IN";


        recognition.onstart =
            () => {

                isListening =
                    true;


                micButton.classList.add(
                    "listening"
                );


                setState(
                    "LISTENING"
                );

            };


        recognition.onresult =
            event => {

                const transcript =
                    event.results[0][0]
                        .transcript
                        .trim();


                if (
                    !transcript
                ) {

                    return;

                }


                commandInput.value =
                    transcript;


                sendMessage();

            };


        recognition.onerror =
            event => {

                console.error(
                    "[VOICE]",
                    event.error
                );


                setState(
                    "SYSTEM READY"
                );

            };


        recognition.onend =
            () => {

                isListening =
                    false;


                micButton.classList.remove(
                    "listening"
                );


                if (
                    !isSending
                ) {

                    setState(
                        "SYSTEM READY"
                    );

                }

            };

    }


    setupVoice();


    /* =========================================================
       MIC BUTTON
    ========================================================= */

    micButton.addEventListener(
        "click",
        () => {

            if (
                !recognition
            ) {

                addMessage(
                    "Sir, या browser मध्ये voice recognition supported नाही.",
                    "assistant"
                );

                return;

            }


            if (
                isListening
            ) {

                recognition.stop();

                return;

            }


            try {

                recognition.start();

            }
            catch (error) {

                console.error(
                    "[VOICE]",
                    error
                );

            }

        }
    );


    /* =========================================================
       SPEECH
    ========================================================= */

    function speak(
        text
    ) {

        if (
            !window.speechSynthesis
        ) {

            return;

        }


        const value =
            String(
                text || ""
            ).trim();


        if (
            !value
        ) {

            return;

        }


        window.speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(
                value
            );


        utterance.rate =
            0.95;


        utterance.pitch =
            0.95;


        utterance.volume =
            1;


        utterance.onstart =
            () => {

                setState(
                    "SPEAKING"
                );

            };


        utterance.onend =
            () => {

                if (
                    !isSending &&
                    !isListening
                ) {

                    setState(
                        "SYSTEM READY"
                    );

                }

            };


        const voices =
            window.speechSynthesis
                .getVoices();


        const devanagari =
            /[\u0900-\u097F]/
                .test(
                    value
                );


        const voice =

            voices.find(
                v =>
                    devanagari
                    &&
                    v.lang
                        .toLowerCase()
                        .startsWith(
                            "mr"
                        )
            )

            ||

            voices.find(
                v =>
                    devanagari
                    &&
                    v.lang
                        .toLowerCase()
                        .startsWith(
                            "hi"
                        )
            )

            ||

            voices.find(
                v =>
                    v.lang
                        .toLowerCase()
                        .startsWith(
                            "en-in"
                        )
            )

            ||

            voices.find(
                v =>
                    v.lang
                        .toLowerCase()
                        .startsWith(
                            "en"
                        )
            );


        if (
            voice
        ) {

            utterance.voice =
                voice;

        }


        window.speechSynthesis.speak(
            utterance
        );

    }


    /* =========================================================
       VISION
    ========================================================= */

    visionButton.addEventListener(
        "click",
        () => {

            visionInput.click();

        }
    );


    visionInput.addEventListener(
        "change",
        async () => {

            const file =
                visionInput.files[0];


            if (
                !file
            ) {

                return;

            }


            const objectUrl =
                URL.createObjectURL(
                    file
                );


            visionLayer.classList.add(
                "active"
            );


            visionPreview.src =
                objectUrl;


            visionTitle.textContent =
                "ANALYZING IMAGE";


            visionStatus.textContent =
                "ACTIVE";


            visionStatus.className =
                "ready";


            setState(
                "VISION PROCESSING"
            );


            try {

                const formData =
                    new FormData();


                formData.append(
                    "image",
                    file
                );


                formData.append(
                    "prompt",
                    "या image मध्ये काय दिसत आहे? महत्वाचे details थोडक्यात सांगा."
                );


                const response =
                    await fetch(
                        VISION_ENDPOINT,
                        {
                            method:
                                "POST",

                            body:
                                formData
                        }
                    );


                const data =
                    await response.json();


                const reply =
                    String(
                        data.reply ||
                        data.message ||
                        ""
                    ).trim();


                if (
                    data.success &&
                    reply
                ) {

                    visionTitle.textContent =
                        "VISION COMPLETE";


                    addMessage(
                        reply,
                        "assistant"
                    );


                    speak(
                        reply
                    );


                    visionStatus.textContent =
                        "READY";


                    visionStatus.className =
                        "ready";

                }
                else {

                    visionTitle.textContent =
                        "VISION ERROR";


                    addMessage(
                        reply ||
                        "Sir, Vision analysis failed.",
                        "assistant"
                    );


                    visionStatus.textContent =
                        "ERROR";


                    visionStatus.className =
                        "offline";

                }

            }
            catch (error) {

                console.error(
                    "[VISION]",
                    error
                );


                visionTitle.textContent =
                    "VISION ERROR";


                addMessage(
                    "Sir, Vision backend शी connection problem आली.",
                    "assistant"
                );


                visionStatus.textContent =
                    "ERROR";


                visionStatus.className =
                    "offline";

            }


            setState(
                "SYSTEM READY"
            );


            setTimeout(
                () => {

                    visionLayer.classList.remove(
                        "active"
                    );


                    URL.revokeObjectURL(
                        objectUrl
                    );

                },
                1600
            );


            visionInput.value =
                "";

        }
    );


    /* =========================================================
       CLOSE VISION
    ========================================================= */

    visionLayer.addEventListener(
        "click",
        () => {

            visionLayer.classList.remove(
                "active"
            );

        }
